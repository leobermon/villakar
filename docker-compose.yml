# MySQL local para desarrollo. Credenciales solo de desarrollo.
services:
  mysql:
    image: mysql:8.4
    container_name: cancun-transfers-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cancun_transfers
      MYSQL_USER: transfers
      MYSQL_PASSWORD: transfers
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
