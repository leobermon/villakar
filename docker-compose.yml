# MySQL local para desarrollo. Credenciales solo de desarrollo.
services:
  mysql:
    image: mysql:8.4
    container_name: cancun-transfers-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cancun_transfers
      MYSQL_USER: transfers
      MYSQL_PASSWORD: transfers
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Buzón de prueba: atrapa todos los correos que envía el backend en desarrollo.
  # Ver los correos en http://localhost:8025 (no sale nada a internet).
  mailpit:
    image: axllent/mailpit:latest
    container_name: cancun-transfers-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Buzón web

volumes:
  mysql_data:
